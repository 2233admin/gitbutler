<svg xmlns="http://www.w3.org/2000/svg" width="768" height="686"><style>.fg{fill:#aaa}.bg{fill:#000}.fg-green{fill:#0a0}.fg-red{fill:#a00}.fg-yellow{fill:#a50}.container{padding:0 10px;line-height:18px}tspan{font:14px SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;white-space:pre;line-height:18px}</style><rect width="100%" height="100%" y="0" class="bg" rx="4.5"/><text class="container fg" xml:space="preserve"><tspan x="10" y="28"><tspan class="fg-red">The GitButler CLI change control system</tspan> </tspan> <tspan x="10" y="46"> </tspan> <tspan x="10" y="64"><tspan>Usage: but [OPTIONS] &lt;COMMAND&gt;</tspan> </tspan> <tspan x="10" y="82"><tspan> but [OPTIONS] [RUB-SOURCE] [RUB-TARGET]</tspan> </tspan> <tspan x="10" y="100"> </tspan> <tspan x="10" y="118"><tspan>The GitButler CLI can be used to do nearly anything the desktop client can do (and more).</tspan> </tspan> <tspan x="10" y="136"><tspan>It is a drop in replacement for most of the Git commands you would normally use, but Git</tspan> </tspan> <tspan x="10" y="154"><tspan>commands (blame, log, etc) can also be used, as GitButler is fully Git compatible.</tspan> </tspan> <tspan x="10" y="172"> </tspan> <tspan x="10" y="190"><tspan>Checkout the full docs here: https://docs.gitbutler.com/cli-overview</tspan> </tspan> <tspan x="10" y="208"> </tspan> <tspan x="10" y="226"><tspan class="fg-yellow">Inspection</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="244"> </tspan> <tspan x="10" y="262"><tspan class="fg-yellow">Branching and Committing</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="280"><tspan> </tspan><tspan class="fg-green">branch </tspan><tspan>Commands for managing branches</tspan> </tspan> <tspan x="10" y="298"> </tspan> <tspan x="10" y="316"><tspan class="fg-yellow">Server Interactions</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="334"><tspan> </tspan><tspan class="fg-green">forge </tspan><tspan>Commands for interacting with forges like GitHub, GitLab (comin…</tspan> </tspan> <tspan x="10" y="352"> </tspan> <tspan x="10" y="370"><tspan class="fg-yellow">Editing Commits</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="388"> </tspan> <tspan x="10" y="406"><tspan class="fg-yellow">Operation History</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="424"> </tspan> <tspan x="10" y="442"><tspan class="fg-yellow">Other Commands</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="460"><tspan> </tspan><tspan class="fg-green">gui </tspan><tspan>Open the GitButler GUI for the current project</tspan> </tspan> <tspan x="10" y="478"> </tspan> <tspan x="10" y="496"><tspan>To add command completion, add this to your shell rc: (for example ~/.zshrc)</tspan> </tspan> <tspan x="10" y="514"><tspan> eval &quot;$(but completions zsh)&quot;</tspan> </tspan> <tspan x="10" y="532"> </tspan> <tspan x="10" y="550"><tspan>To use the GitButler CLI with coding agents (Claude Code hooks, Cursor hooks, MCP), see:</tspan> </tspan> <tspan x="10" y="568"><tspan> https://docs.gitbutler.com/features/ai-integration/ai-overview</tspan> </tspan> <tspan x="10" y="586"> </tspan> <tspan x="10" y="604"><tspan class="fg-yellow">Options</tspan><tspan>:</tspan> </tspan> <tspan x="10" y="622"><tspan> -C, --current-dir &lt;PATH&gt; Run as if but was started in PATH instead of the cu…</tspan> </tspan> <tspan x="10" y="640"><tspan> -j, --json Whether to use JSON output format</tspan> </tspan> <tspan x="10" y="658"><tspan> -h, --help Print help</tspan></tspan></text></svg>